<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pace & Co. | Link Bio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="phone">

  <!-- PROFIL LINK BIO -->
  <header class="profile">
    <img src="./images/Profil.jpg" alt="Pace & Co. Logo" class="profile-img">
    <h1>Pace & Co.</h1>
    <p>Engineered for Speed • Modern • Professional</p>

    <div class="social">
      <a href="https://www.instagram.com/_yaannn.rh?stkn=bWVqZHVseXAwcGFn&utm_source=qr" target="_blank">Instagram</a>
      <a href="https://wa.me/6281515453116" target="_blank">WhatsApp</a>
    </div>
  </header>

  <!-- SEARCH -->
  <section class="search-box">
    <input type="text" id="searchInput" placeholder="Cari sepatu running, carbon plate, socks...">
  </section>

  <!-- FILTER -->
  <div class="filter">
    <button class="filter-btn active" data-category="semua">Semua</button>
    <button class="filter-btn" data-category="daily">Daily Trainer</button>
    <button class="filter-btn" data-category="carbon">Race Carbon</button>
    <button class="filter-btn" data-category="apparel">Apparel & Aksesoris</button>
  </div>

  <!-- KATALOG -->
  <section class="catalog">
    <div class="catalog-head">
      <div>
        <h2>Katalog Produk</h2>
        <p>Temukan gear lari terbaikmu</p>
      </div>
      <button class="cart-open" onclick="bukaKeranjang()">
        🛒 <span id="jumlahKeranjang">0</span>
      </button>
    </div>

    <div id="productList" class="product-list"></div>
  </section>

  <footer>
    <p>© 2026 Pace & Co. All rights reserved.</p>
  </footer>
</div>

<!-- KERANJANG -->
<div id="cartModal" class="modal">
  <div class="cart">
    <div class="cart-header">
      <div>
        <h2>Keranjang Belanja</h2>
        <p>Atur item pilihanmu sebelum checkout</p>
      </div>
      <button class="close" onclick="tutupKeranjang()">×</button>
    </div>

    <div id="cartList"></div>

    <div class="total">
      <span>Total Harga</span>
      <strong id="totalHarga">Rp0</strong>
    </div>

    <button class="checkout" onclick="checkoutWhatsApp()">
      Checkout via WhatsApp
    </button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
